<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpanseFlow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <span>ExpanseFlow</span>
        </div>
        <div class="navbar">
            <a href="#home">
                <i class="fa-solid fa-house"></i>
                Home
            </a>
            <a href="#expense">
                <i class="fa-solid fa-receipt"></i>
                Expanses
            </a>
            <a href="#analytics">
                <i class="fa-solid fa-chart-column"></i>
                Analytics
            </a>
        </div>
        <div class="rightNav">

            <div class="searchbar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search your Expenses...">
            </div>
            <div class="button">
                <button><i class="fa-solid fa-moon"></i></button>
            </div>

            <div class="name">
                <div class="circle">D</div>
                <span>Divyanshi</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>

        <main>
            <section>
                <div class="page-heading">
                    <div>
                        <h1>Hello Divyanshi...👋</h1>
                        <p>Here your Expenses overview for this month.</p>
                    </div>
                    <div class="btn">
                        <button>
                            <i class="fa-solid fa-plus"></i>
                            Add Expense
                        </button>
                    </div>
                </div>

                <div id="home">
                    <div class="card">
                        <div>
                            <i class="fa-solid fa-wallet"></i>
                        </div>

                        <p>Total Expense</p>

                        <h2>₹0</h2>

                        <span>
                            <i class="fa-solid fa-arrow-down" ></i>
                            Your total spending
                        </span>
                        
                    </div>
                    <div class="card">
                        <div>
                            <i class="fa-solid fa-calendar"></i>
                        </div>

                        <p>This Month</p>

                        <h2>₹0</h2>

                        <span>
                            <i class="fa-solid fa-chart-line" ></i>
                            Monthly spending
                        </span>

                    </div>
                    <div class="card">
                        <div>
                            <i class="fa-solid fa-chart-line"></i>
                        </div>

                        <p>Average Expense</p>

                        <h2>₹0</h2>

                        <span>
                            <i class="fa-solid fa-calculator" ></i>
                            Per transaction
                        </span>

                    </div>
                    <div class="card">
                        <div>
                            <i class="fa-solid fa-star"></i>
                        </div>

                        <p>Highest Expence</p>

                        <h2>₹0</h2>

                        <span>
                            <i class="fa-solid fa-arrow-up" ></i>
                            Largest trasaction
                        </span>

                    </div>

                    

                </div>
            </section>
        </main>
    </header>
</body>
